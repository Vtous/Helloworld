# Surge modern reference, checked 2026-11-08.
# Target: Surge Mac 6.11 / Surge iOS 6.0 TestFlight.
# 直连参考基线：不含你的代理节点，不要覆盖当前可用配置。
# 广告规则参考现有 adgoaway；语法与版本依据见 docs/surge-current-features-2026-11-08.md。
# 模板内嵌这 8 条规则，不必再同时安装同一批域名的模块。
# SPDX-License-Identifier: GPL-3.0-only

[General]
loglevel = notify
dns-server = system
block-quic = per-policy
test-timeout = 5
# 可选 HTTPS 测速。按实际可达性选择，默认沿用 Surge 自身默认值。
# internet-test-url = https://www.apple.com/library/test/success.html
# proxy-test-url = https://www.gstatic.com/generate_204
# 可选加密 DNS 也需根据当前网络决定，默认不强制更换解析器。
# encrypted-dns-server = https://dns.alidns.com/dns-query
# encrypted-dns-skip-cert-verification = false
# AI 控制默认关闭。若启用，只在本地填写强随机密钥。
# http-api = REPLACE_WITH_RANDOM_LOCAL_KEY@127.0.0.1:6171
# http-api-mcp = true
# Mac：仅供本机连接的代理监听。
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153

[Proxy Group]
# 只有 DIRECT 的参考组；本地加入真实代理节点后再设计自动组或链式代理。
Outbound = select, DIRECT, category=Routing

[Ruleset LocalAds]
# 两步路
DOMAIN-SUFFIX,admobile.top
# 小寻：共同域名规则仍会影响其他 App 对相同域名的访问。
DOMAIN-SUFFIX,yfanads.com
DOMAIN-SUFFIX,yfanads.cn
DOMAIN-SUFFIX,adxvip.com
DOMAIN,impdsp.meituan.com
DOMAIN,clickdsp.meituan.com
DOMAIN,cdn.51tuiyi.com
DOMAIN,yfan-dsp.tos-cn-shanghai.volces.com

[Rule]
# 预匹配先于所有普通白名单执行；保留普通规则顺序时删除末尾的 ,pre-matching。
RULE-SET,LocalAds,REJECT,pre-matching
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT

# 社区大型去广告列表：默认关闭，按需取消注释。
# 列表含混合类型，不在整份列表上追加 pre-matching。
# RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT

# 替换/设计出口前，这份参考配置全部直连。
FINAL,Outbound

# MITM 默认没有配置，也没有自动启用。
# 如需小寻/两步路的可选 HTTPS 规则，参阅根目录 adgoaway.sgmodule 注释段。
