# Modern configuration reference.
# Target: Surge Mac 6.11 / Surge iOS 6.0 TestFlight.
# Direct routing only. Do not replace an existing working profile.
# This file embeds the adgoaway domain list; avoid duplicate enabled copies.
# SPDX-License-Identifier: GPL-3.0-only

[General]
loglevel = notify
dns-server = system
block-quic = per-policy
test-timeout = 5
# Optional HTTPS test endpoints; choose according to network reachability.
# internet-test-url = https://www.apple.com/library/test/success.html
# proxy-test-url = https://www.gstatic.com/generate_204
# Optional encrypted DNS.
# encrypted-dns-server = https://dns.alidns.com/dns-query
# encrypted-dns-skip-cert-verification = false
# Optional local control. Replace the placeholder locally before enabling.
# http-api = REPLACE_WITH_RANDOM_LOCAL_KEY@127.0.0.1:6171
# http-api-mcp = true
# Automatic takeover. LAN and hotspot sharing remain disabled.
compatibility-mode = 0
allow-wifi-access = false
allow-hotspot-access = false

[Proxy Group]
# Add actual proxy policies locally before designing automatic groups.
Outbound = select, DIRECT, category=Routing

[Ruleset LocalAds]
# 2bulu
DOMAIN-SUFFIX,admobile.top
# Xiaoxun
DOMAIN-SUFFIX,yfanads.com
DOMAIN-SUFFIX,yfanads.cn
DOMAIN-SUFFIX,adxvip.com
DOMAIN,impdsp.meituan.com
DOMAIN,clickdsp.meituan.com
DOMAIN,cdn.51tuiyi.com
DOMAIN,yfan-dsp.tos-cn-shanghai.volces.com

[Rule]
# Pre-matching takes precedence over ordinary allow rules.
# Remove the final ,pre-matching option to use ordinary rule order.
RULE-SET,LocalAds,REJECT,pre-matching
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT
FINAL,Outbound

# MITM is not configured or enabled.
# Optional HTTPS settings are stored as comments in adgoaway.sgmodule.
